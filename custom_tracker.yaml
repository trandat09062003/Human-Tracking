# Tracker — giữ ID lâu khi che khuất / miss detection
tracker_type: botsort

track_high_thresh: 0.35
track_low_thresh: 0.12
new_track_thresh: 0.45
# ~5s @ 30fps
track_buffer: 150
# Lỏng để tái khớp sau miss (cost=1-IoU; cao hơn = dễ match hơn)
match_thresh: 0.80
fuse_score: True

gmc_method: none

proximity_thresh: 0.50
appearance_thresh: 0.25
with_reid: False
model: auto
